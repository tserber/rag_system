[project]
name = "rag-system"
version = "0.1.0"
description = "A retrieval (and optional generation) system over Qdrant, with a Telegram front-end and a reusable core."
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.9",
    # Capped below 6.0: sentence-transformers>=6 pulls in transformers>=5,
    # and every transformers 5.x release available here has a genuine
    # packaging bug (a bare `nn.Module` reference in
    # transformers/integrations/accelerate.py with no `import torch.nn as nn`
    # and no `from __future__ import annotations`, so loading the module
    # raises NameError before any model even gets touched). Pin stays until
    # a transformers 5.x release actually fixes that import.
    "sentence-transformers>=3.0,<6.0",
    "transformers>=4.30,<5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "aiogram>=3.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    # rag_core.live (VadSegmenter) imports numpy unconditionally, unlike
    # faster-whisper/sounddevice which stay lazy-imported and optional.
    # Already pulled in transitively by sentence-transformers, but declared
    # explicitly since rag_core now has a direct hard dependency on it.
    # Capped below 2.0: torch 2.2.x (the newest available here) was built
    # against numpy 1.x's C ABI and raises "Numpy is not available" at
    # encode() time under numpy 2.x -- see scipy/scikit-learn pins below,
    # which exist only to stay compatible with this same numpy cap.
    "numpy>=1.24,<2.0",
    "scipy<1.13",
    "scikit-learn<1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Needed only to ingest audio files (rag_core.transcription). Bundles its own
# audio decoder (PyAV), so no system ffmpeg install is required.
audio = [
    "faster-whisper>=1.0",
]
# Needed only for live microphone listening (interfaces/live_listener).
# Builds on [audio] -- same transcriber, just fed from a mic instead of a
# file -- plus sounddevice for the actual audio capture (numpy is already a
# base dependency, see above).
live = [
    "rag-system[audio]",
    "sounddevice>=0.4",
]
# Needed only to run or package the drag-and-drop desktop app
# (interfaces/desktop_app). tkinter itself ships with Python, not pip --
# see README's "Desktop app" section if `import tkinter` fails on your OS.
# tkinterdnd2 is optional even within this extra: the app still runs and
# still works without it, just falls back to click-to-browse instead of
# true drag-and-drop (see main.py's _DND_AVAILABLE fallback).
desktop = [
    "tkinterdnd2>=0.3",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
